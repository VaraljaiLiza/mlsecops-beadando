x-app: &app
  build: .
  image: mlsecops-beadando:local
  pull_policy: build

services:
  mlflow:
    <<: *app
    command:
      - python
      - -m
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////app/mlflow-data/mlflow.db
      - --artifacts-destination
      - /app/mlflow-data/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-storage:/app/mlflow-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  bootstrap:
    <<: *app
    command:
      - sh
      - -c
      - dvc pull && python src/preprocessing.py && python -m scripts.train
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - dataset-storage:/app/data
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    <<: *app
    command:
      - python
      - -m
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dataset-storage:/app/data
      - prediction-logs:/app/logs
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  dashboard:
    <<: *app
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - dataset-storage:/app/data
      - prediction-logs:/app/logs:ro
      - monitoring-reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow-storage:
  dataset-storage:
  prediction-logs:
  monitoring-reports: